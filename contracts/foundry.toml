[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
ast = true
ffi = true
build_info = true
extra_output = ["metadata", "ir", "irOptimized", "storageLayout"]

[profile.ci]
verbosity = 2


remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/"
]

[rpc_endpoints]
bscTestnet = "https://bsc-testnet.core.chainstack.com/de08ab89056f38225c6c77de1fcc5fc3"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
